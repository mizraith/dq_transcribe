<!doctype html>
<!--
  Printable DQ slips (one per page), laid out like the USA Swimming
  "Disqualification Report" slip of the revision in use. Filled in by
  dq_transcribe.slip_page.render_slips. Names are written in a script font.
  This file is a string.Template: never use a literal dollar sign here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <style>
    @font-face { font-family: "Slip Script"; src: url("${font_url}") format("woff2"); font-weight: 600; }
    :root { --ink: #111; --fill: #1d3fa8; --line: #222; }
    @page { size: letter; margin: 0.4in; }
    body { margin: 0; background: #e5e7eb; color: var(--ink); font-family: Arial, Helvetica, sans-serif; }
    .toolbar { position: relative; top: 0; display: flex; gap: 0.6rem; align-items: center; padding: 0.6rem 1rem; background: #111827; color: #fff; z-index: 2; }
    .toolbar button { font-size: 1.1rem; padding: 0.5rem 1.2rem; border: 0; border-radius: 0.4rem; background: #1e3a8a; color: #fff; font-weight: 700; }
    .slip { width: 5.2in; margin: 0.4in auto; padding: 0.35in 0.4in; background: #fff; box-shadow: 0 0.2rem 0.8rem rgba(0,0,0,0.2); font-size: 9.5pt; line-height: 1.45; font-variant: small-caps; page-break-after: always; break-after: page; }
    .slip:last-child { page-break-after: auto; break-after: auto; }
    .slip h1 { font-size: 13pt; margin: 0 0 0.12in; letter-spacing: 0.02em; font-variant: normal; }
    .row { display: flex; flex-wrap: wrap; gap: 0 0.18in; align-items: baseline; margin: 0.05in 0; }
    .blank { display: inline-block; min-width: 0.45in; border-bottom: 1px solid var(--line); text-align: center; color: var(--fill); font-variant: normal; font-weight: 700; padding: 0 0.04in; }
    .blank.wide { min-width: 1.1in; }
    .blank.phase { min-width: 0.3in; }
    .blank.full { flex: 1; min-width: 1.5in; text-align: left; }
    .blank.name { font-family: "Slip Script", cursive; font-size: 15pt; font-weight: 600; line-height: 1.1; }
    .section { margin-top: 0.1in; }
    .section-title { font-weight: 700; text-decoration: underline; margin-right: auto; }
    .item { white-space: nowrap; }
    .item.chosen { background: #fef9c3; }
    .group-label { font-weight: 400; }
    .indent { padding-left: 0.18in; }
    .footer { display: flex; justify-content: space-between; margin-top: 0.15in; font-size: 8pt; font-variant: normal; }
    .copy { color: #b91c1c; font-weight: 700; font-size: 11pt; }
    .hint { font-size: 7pt; font-style: italic; font-variant: normal; text-align: center; }
    @media print {
      body { background: #fff; }
      .toolbar { display: none; }
      .slip { width: auto; margin: 0; padding: 0; box-shadow: none; font-size: 9pt; line-height: 1.32; }
      .row { margin: 0.025in 0; }
      .section { margin-top: 0.06in; }
      .item.chosen { background: none; }
    }
  </style>
</head>
<body>
  <div class="toolbar">
    <button type="button" onclick="window.print()">Print</button>
    <span>${toolbar_text}</span>
  </div>
  ${slips}
</body>
</html>
