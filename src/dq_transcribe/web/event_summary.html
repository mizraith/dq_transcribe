<!doctype html>
<!--
  Printed DQ summary for one event, for the Meet Manager computer operator
  (enter the codes, invalidate the times). Filled in by
  dq_transcribe.event_summary.render_event_summary.
  This file is a string.Template: never use a literal dollar sign here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <style>
    @page { size: letter portrait; margin: 0.5in; }
    body { margin: 0; background: #e5e7eb; color: #111; font-family: Arial, Helvetica, sans-serif; }
    .toolbar { display: flex; gap: 0.6rem; align-items: center; padding: 0.6rem 1rem; background: #111827; color: #fff; }
    .toolbar button { font-size: 1.1rem; padding: 0.5rem 1.2rem; border: 0; border-radius: 0.4rem; background: #1e3a8a; color: #fff; font-weight: 700; }
    .page { max-width: 7.5in; margin: 0.3in auto; padding: 0.4in; background: #fff; box-shadow: 0 0.2rem 0.8rem rgba(0,0,0,0.2); }
    h1 { font-size: 20pt; margin: 0; }
    .meet { font-size: 11pt; color: #374151; margin: 0.04in 0 0.15in; }
    h2 { font-size: 12pt; margin: 0.25in 0 0.06in; }
    table { width: 100%; border-collapse: collapse; font-size: 13pt; }
    th { text-align: left; font-size: 9pt; text-transform: uppercase; color: #374151; border-bottom: 2px solid #111; padding: 0.04in 0.06in; }
    td { border-bottom: 1px solid #9ca3af; padding: 0.07in 0.06in; vertical-align: top; }
    td.num { text-align: center; font-weight: 700; width: 0.45in; }
    td.code { font-weight: 700; font-size: 15pt; white-space: nowrap; }
    td.box { font-size: 18pt; text-align: center; width: 0.5in; }
    td.none { color: #6b7280; text-align: center; }
    tr.struck td { text-decoration: line-through; color: #6b7280; }
    .pending { margin-top: 0.2in; font-weight: 700; color: #b91c1c; }
    .footer { margin-top: 0.3in; font-size: 8pt; color: #6b7280; }
    @media print { body { background: #fff; } .toolbar { display: none; } .page { box-shadow: none; margin: 0; padding: 0; max-width: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="window.print()">Print</button><span>For the Meet Manager operator: enter each code and invalidate the time.</span></div>
  <section class="page">
    <h1>Event ${event} DQs (${count})</h1>
    <div class="meet">${event_label} &middot; ${meet_name}</div>
    <table>
      <thead><tr><th>Heat</th><th>Lane</th><th>Swimmer</th><th>Club</th><th>Code</th><th>Infraction</th><th>Official</th><th>Entered</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>
    ${overturned}
    ${pending}
    <div class="footer">Printed ${printed} by ${app_name}</div>
  </section>
</body>
</html>
