<!doctype html>
<!--
  Printed DQ summary for one event, for the Meet Manager computer operator
  (enter the codes, invalidate the times). Filled in by
  dq_transcribe.event_summary.render_event_summary.
  This file is a string.Template: never use a literal dollar sign here.
-->
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>${title}</title>
  <style>
    /* Fixed type sizes (11 pt table and details, 16 pt title), never scaled to fill the page.
       The table has fixed column widths that add up to the page width, so it always fits a
       portrait letter or A4 sheet (long words wrap inside their column instead of overflowing). */
    @page { size: portrait; margin: 0.5in; }
    body { margin: 0; background: #e5e7eb; color: #111; font-family: Arial, Helvetica, sans-serif; font-size: 11pt; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .toolbar { display: flex; gap: 0.6rem; align-items: center; padding: 0.6rem 1rem; background: #111827; color: #fff; font-size: 12pt; }
    .toolbar button { font-size: 13pt; padding: 0.4rem 1.2rem; border: 0; border-radius: 0.4rem; background: #1e3a8a; color: #fff; font-weight: 700; }
    .page { max-width: 7.2in; margin: 0.3in auto; padding: 0.4in; background: #fff; box-shadow: 0 0.2rem 0.8rem rgba(0,0,0,0.2); }
    h1 { font-size: 16pt; margin: 0 0 6pt; }
    dl.meta { display: grid; grid-template-columns: max-content auto; gap: 1pt 10pt; margin: 0 0 10pt; font-size: 11pt; }
    dl.meta dt { font-weight: 700; color: #374151; }
    dl.meta dd { margin: 0; }
    h2 { font-size: 12pt; margin: 14pt 0 5pt; }
    table { width: 100%; table-layout: fixed; border-collapse: collapse; font-size: 11pt; }
    col.heat, col.lane { width: 7%; }
    col.swimmer { width: 20%; }
    col.club { width: 9%; }
    col.code { width: 11%; }
    col.what { width: 23%; }
    col.status { width: 14%; }
    col.box { width: 9%; }
    th { text-align: left; font-size: 8.5pt; text-transform: uppercase; color: #374151; border-bottom: 2px solid #111; padding: 2pt 4pt; overflow: hidden; }
    td { border-bottom: 1px solid #9ca3af; padding: 4pt 4pt; vertical-align: top; overflow-wrap: anywhere; }
    td.num { text-align: center; font-weight: 700; }
    td.code { font-weight: 700; font-size: 12pt; }
    td.code div, td.what div { min-height: 1.3em; }
    td.code .unsure { font-weight: 400; font-style: italic; font-size: 10pt; }
    td.what .note { color: #6b7280; font-size: 9pt; }
    td.status { font-size: 9.5pt; font-weight: 700; }
    /* Status colours as on the DQ page's badges, so Incomplete and Declined stand out. */
    td.status span { display: inline-block; padding: 1pt 5pt; border-radius: 7pt; }
    .status-called { background: #fef3c7; color: #92400e; }
    .status-incomplete { background: #ffedd5; color: #9a3412; border: 1pt solid #f97316; }
    .status-pending_notification { background: #dcfce7; color: #166534; }
    .status-notified { background: #dbeafe; color: #1e40af; }
    .status-protested { background: #ede9fe; color: #5b21b6; }
    .status-upheld { background: #fee2e2; color: #991b1b; }
    .status-overturned { background: #f0fdf4; color: #166534; border: 1pt solid #86efac; }
    .status-declined { background: #e5e7eb; color: #374151; border: 1pt solid #6b7280; }
    td.box { font-size: 14pt; text-align: center; }
    td.none { color: #6b7280; text-align: center; }
    tr.struck td { text-decoration: line-through; color: #6b7280; }
    tr.struck td.status { text-decoration: none; }
    .pending { margin-top: 10pt; font-weight: 700; color: #b91c1c; font-size: 11pt; }
    .all-note { margin-top: 10pt; font-size: 10pt; color: #374151; }
    .footer { margin-top: 14pt; font-size: 8pt; color: #6b7280; }
    @media print { body { background: #fff; } .toolbar { display: none; } .page { box-shadow: none; margin: 0; padding: 0; max-width: none; } }
  </style>
</head>
<body>
  <div class="toolbar"><button type="button" onclick="window.print()">Print</button><span>For the Meet Manager operator: enter each code and invalidate the time.</span></div>
  <section class="page">
    <h1>${heading}</h1>
    <dl class="meta">${meta}</dl>
    <table>
      ${colgroup}
      <thead>${head}</thead>
      <tbody>${rows}</tbody>
    </table>
    ${after}
    <div class="footer">${app_name}</div>
  </section>
</body>
</html>
