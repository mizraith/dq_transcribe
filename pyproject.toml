[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dq_transcribe"
version = "0.1.0"
description = "Local-first audio recording and transcription with an editable local database."
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dq_transcribe = ["web/*.html"]
